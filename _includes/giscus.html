{% if site.giscus.repo and site.giscus.repo_id and site.giscus.category_id %}
<div class="giscus-section">
  <div class="giscus-actions">
    <a href="https://github.com/sponsors/Funghi88" class="like-btn" target="_blank" rel="noopener">
      <span class="like-btn-zh">觉得不错, 请 Annabelle 喝杯椰汁! 🥥</span>
      <span class="like-btn-en">Like it? Buy Annabelle a coconut! 🥥</span>
    </a>
  </div>
  <h3 class="giscus-heading">
    <span class="giscus-heading-zh">认识一下, 我是安娜!</span>
    <span class="giscus-heading-en">Feel free to discuss!!</span>
  </h3>
  <div class="giscus"></div>
</div>
<script src="https://giscus.app/client.js"
  data-repo="{{ site.giscus.repo }}"
  data-repo-id="{{ site.giscus.repo_id }}"
  data-category="{{ site.giscus.category | default: 'Comments' }}"
  data-category-id="{{ site.giscus.category_id }}"
  data-mapping="pathname"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="top"
  data-theme="light"
  data-lang="en"
  crossorigin="anonymous"
  async>
</script>
{% endif %}
