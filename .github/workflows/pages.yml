# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mirror host URLs for funghi8 backup repo
        if: github.repository == 'funghi8/funghi8.github.io'
        run: |
          sed -i 's|url: "https://funghi88.github.io"|url: "https://funghi8.github.io"|' _config.yml
          sed -i 's|https://funghi88.github.io/sitemap.xml|https://funghi8.github.io/sitemap.xml|' robots.txt
      - name: Remove Jekyll cache
        run: rm -rf .jekyll-cache
      - name: Generate OG card images
        run: |
          pip install Pillow PyYAML --quiet
          python3 scripts/generate-og-cards.py
      - name: Generate English post pages
        run: ruby scripts/generate-en-posts.rb
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
